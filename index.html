
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  #gc{position:relative;width:100%;max-width:420px;margin:0 auto;height:640px;background:linear-gradient(180deg,#0d1b2a 0%,#1a2e1a 60%,#0d2219 100%);border-radius:16px;overflow:hidden;font-family:'Nunito',sans-serif;border:2px solid #2a4a3a;user-select:none;}
  #road{position:absolute;bottom:0;left:0;width:100%;height:72px;background:#1a1a2e;border-top:3px solid #ff6b35;}
  .rm{position:absolute;bottom:28px;height:7px;width:36px;background:#ffd700;border-radius:3px;}
  #hud{position:absolute;top:8px;left:0;width:100%;padding:0 10px;z-index:20;}
  .bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .bar-label{font-size:11px;font-weight:800;color:#fff;min-width:20px;text-align:center;}
  .bar-track{flex:1;height:14px;background:#ffffff22;border-radius:7px;overflow:hidden;border:1px solid #ffffff33;}
  .bar-fill{height:100%;border-radius:7px;transition:width 0.2s;}
  #hbar-fill{background:#e74c3c;}
  #cbar-fill{background:#f39c12;}
  #lives-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  #scorebox{font-size:16px;font-weight:800;color:#ffd700;font-family:monospace;}
  #livebox{display:flex;gap:2px;font-size:18px;}
  #player{position:absolute;width:60px;height:76px;z-index:10;}
  .item{position:absolute;width:42px;height:42px;z-index:8;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:50%;}
  #statusmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;color:#fff;font-family:monospace;text-align:center;z-index:25;pointer-events:none;opacity:0;transition:opacity 0.25s;line-height:1.4;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000cc;z-index:30;border-radius:14px;}
  #overlay h1{font-size:32px;font-weight:800;color:#ffd700;margin-bottom:6px;font-family:monospace;}
  #overlay p{color:#fff;font-size:13px;margin:2px 0 16px;text-align:center;max-width:300px;font-weight:700;line-height:1.6;}
  #startbtn{background:#e74c3c;color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:18px;font-weight:800;cursor:pointer;font-family:monospace;}
  #startbtn:hover{background:#c0392b;}
  #finalscore{font-size:24px;color:#ffd700;font-weight:800;font-family:monospace;margin:8px 0;}
  #legend{position:absolute;bottom:80px;right:6px;z-index:20;display:flex;flex-direction:column;gap:2px;}
  .leg{font-size:10px;color:#ffffffaa;display:flex;align-items:center;gap:3px;}
  #effects{position:absolute;inset:0;pointer-events:none;z-index:22;border-radius:14px;opacity:0;transition:opacity 0.35s;}
</style>

<div id="gc">
  <div id="effects"></div>
  <div id="road">
    <div class="rm" style="left:20px"></div><div class="rm" style="left:100px"></div>
    <div class="rm" style="left:190px"></div><div class="rm" style="left:280px"></div>
    <div class="rm" style="left:370px"></div>
  </div>
  <div id="hud">
    <div class="bar-row">
      <div class="bar-label">❤️</div>
      <div class="bar-track"><div class="bar-fill" id="hbar-fill" style="width:100%"></div></div>
      <div style="font-size:10px;color:#ffffff88;min-width:28px;text-align:right;" id="hlabel">100%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">😮</div>
      <div class="bar-track"><div class="bar-fill" id="cbar-fill" style="width:0%"></div></div>
      <div style="font-size:10px;color:#ffffff88;min-width:28px;text-align:right;" id="clabel">0%</div>
    </div>
    <div id="lives-row">
      <div id="scorebox">🌯 0</div>
      <div id="livebox"></div>
    </div>
  </div>
  <div id="statusmsg"></div>
  <div id="player"></div>
  <div id="legend">
    <div class="leg"><span style="font-size:13px;">🌯</span> +puan, -HP, +boğulma</div>
    <div class="leg"><span style="font-size:13px;">🥗</span> +HP (dikkat!)</div>
    <div class="leg"><span style="font-size:13px;">🥛</span> ayran → -boğulma</div>
    <div class="leg"><span style="font-size:13px;">🧉</span> şalgam → -boğulma⚡</div>
  </div>
  <div id="overlay">
    <div style="font-size:56px;margin-bottom:6px;">🌯</div>
    <h1>Dürüm Drop v2</h1>
    <p>
      ← → veya sürükle<br>
      ❤️ <b>HP:</b> dürüm yer azalır, sebzeyle doldur<br>
      😮 <b>Boğulma:</b> dürümde artar, ayran🥛/şalgam🧉 ile azalt<br>
      Çok sebze → 🤮 &nbsp;|&nbsp; Boğulma dolu → 😵
    </p>
    <button id="startbtn">OYNA / PLAY</button>
    <div id="finalscore" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  const gc=document.getElementById('gc');
  const ov=document.getElementById('overlay');
  const scoreEl=document.getElementById('scorebox');
  const livebox=document.getElementById('livebox');
  const hfill=document.getElementById('hbar-fill');
  const cfill=document.getElementById('cbar-fill');
  const hlabel=document.getElementById('hlabel');
  const clabel=document.getElementById('clabel');
  const playerEl=document.getElementById('player');
  const statusEl=document.getElementById('statusmsg');
  const fxEl=document.getElementById('effects');
  const finalEl=document.getElementById('finalscore');
  const startBtn=document.getElementById('startbtn');

  const W=420,PW=60,PH=76,ROAD=72,H=640;
  const PY=H-ROAD-PH-4;

  const DURUMS=['🌯','🌯','🌯','🫔'];
  const VEGS=['🥗','🥦','🥕','🥒','🍅'];
  const DRINKS=['🥛','🧉'];

  let score,lives,hp,choke,falling,px,speed,spawnT,spawnRate,vegStreak,durumsWithoutDrink,gameOn,aid,keys,stunTimer,stunType,statusTimeout;

  function setLives(l){
    livebox.innerHTML='';
    for(let i=0;i<3;i++) livebox.innerHTML+=`<span style="font-size:17px;opacity:${i<l?1:0.2}">❤️</span>`;
  }

  function updateBars(){
    const h=Math.max(0,Math.min(100,hp));
    const c=Math.max(0,Math.min(100,choke));
    hfill.style.width=h+'%';
    hfill.style.background=h>50?'#2ecc71':h>25?'#f39c12':'#e74c3c';
    cfill.style.width=c+'%';
    cfill.style.background=c>75?'#e74c3c':c>45?'#f39c12':'#3498db';
    hlabel.textContent=Math.round(h)+'%';
    clabel.textContent=Math.round(c)+'%';
  }

  function drawPlayer(){
    playerEl.style.left=px+'px';
    playerEl.style.top=PY+'px';
    const face=stunType==='vomit'?'🤮':stunType==='choke'?'😵':'😐';
    const bodyColor=stunType?'#888':'#e74c3c';
    const armColor=stunType?'#666':'#c0392b';
    playerEl.innerHTML=`<svg viewBox="0 0 60 76" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="14" r="12" fill="#FFDAA5" stroke="#c98a4a" stroke-width="1.5"/>
      <text x="30" y="19" text-anchor="middle" font-size="14">${face}</text>
      <rect x="12" y="24" width="36" height="26" rx="8" fill="${bodyColor}"/>
      <rect x="14" y="28" width="6" height="18" rx="3" fill="${armColor}"/>
      <rect x="40" y="28" width="6" height="18" rx="3" fill="${armColor}"/>
      <rect x="16" y="50" width="10" height="20" rx="5" fill="#3a6ecc"/>
      <rect x="34" y="50" width="10" height="20" rx="5" fill="#3a6ecc"/>
    </svg>`;
  }

  function showStatus(txt,color,dur){
    clearTimeout(statusTimeout);
    statusEl.textContent=txt;
    statusEl.style.color=color;
    statusEl.style.opacity=1;
    statusTimeout=setTimeout(()=>statusEl.style.opacity=0, dur||1000);
  }

  function flashScreen(color){
    fxEl.style.background=color;
    fxEl.style.opacity='0.35';
    setTimeout(()=>fxEl.style.opacity='0',350);
  }

  function loseLife(msg){
    lives=Math.max(0,lives-1);
    setLives(lives);
    showStatus(msg,'#ff4444',1800);
    flashScreen('#ff0000');
    if(lives<=0){endGame();return false;}
    return true;
  }

  function triggerStun(type,msg){
    if(stunTimer>0) return;
    stunType=type;
    stunTimer=180;
    if(!loseLife(msg)) return;
    if(type==='choke'){ choke=15; }
    if(type==='vomit'){ hp=25; vegStreak=0; }
    updateBars();
  }

  function catchItem(type,emoji){
    if(type==='durum'){
      score++;
      scoreEl.textContent='🌯 '+score;
      hp=Math.max(0,hp-14);
      choke=Math.min(100,choke+18);
      vegStreak=0;
      durumsWithoutDrink++;
      flashScreen('#ff6b35');
      if(choke>=100){ triggerStun('choke','😵 BOĞULUYORUM!'); return; }
      if(hp<=0){ triggerStun('vomit','😵 HP bitti!'); return; }
      if(durumsWithoutDrink>=5) showStatus('🥛 Bir şeyler iç!','#f39c12',1000);
      updateBars();
      if(score>0 && score%8===0){ speed+=0.25; spawnRate=Math.max(38,spawnRate-4); }
    } else if(type==='veg'){
      hp=Math.min(100,hp+20);
      vegStreak++;
      durumsWithoutDrink=0;
      flashScreen('#2ecc71');
      updateBars();
      if(vegStreak>=4){ triggerStun('vomit','🤮 Çok fazla sebze!'); return; }
      const msgs=['🥗 Sağlıklı!','🥦 Lif dolu!','🥕 Aferin!'];
      showStatus(msgs[Math.floor(Math.random()*msgs.length)],'#2ecc71',700);
    } else if(type==='drink'){
      const isGood=emoji==='🧉';
      choke=Math.max(0,choke-(isGood?42:28));
      durumsWithoutDrink=0;
      vegStreak=0;
      flashScreen('#3498db');
      updateBars();
      const msgs=isGood?['🧉 Şalgam gücü!','🧉 Mükemmel!']:['🥛 Ahh, ayran!','🥛 Çok iyi!'];
      showStatus(msgs[Math.floor(Math.random()*msgs.length)],'#74b9ff',800);
    }
  }

  function spawnItem(){
    const r=Math.random();
    let emoji,type;
    if(r<0.52){ emoji=DURUMS[Math.floor(Math.random()*DURUMS.length)]; type='durum'; }
    else if(r<0.75){ emoji=VEGS[Math.floor(Math.random()*VEGS.length)]; type='veg'; }
    else{ emoji=DRINKS[Math.floor(Math.random()*DRINKS.length)]; type='drink'; }
    const el=document.createElement('div');
    el.className='item';
    el.textContent=emoji;
    el.dataset.type=type;
    el.dataset.emoji=emoji;
    const x=Math.random()*(W-60)+10;
    el.style.left=x+'px';
    el.style.top='-46px';
    el.dataset.x=x;
    el.dataset.y=-46;
    el.dataset.vx=(Math.random()-0.5)*0.9;
    gc.appendChild(el);
    falling.push(el);
  }

  function initGame(){
    score=0;lives=3;hp=100;choke=0;speed=2.2;spawnRate=80;spawnT=0;
    vegStreak=0;durumsWithoutDrink=0;stunTimer=0;stunType=null;gameOn=true;
    scoreEl.textContent='🌯 0';
    setLives(3);updateBars();
    falling.forEach(f=>{try{gc.removeChild(f);}catch(e){}});
    falling=[];
    px=(W-PW)/2;
    drawPlayer();
    statusEl.style.opacity=0;
    ov.style.display='none';
  }

  function endGame(){
    gameOn=false;
    cancelAnimationFrame(aid);
    falling.forEach(f=>{try{gc.removeChild(f);}catch(e){}});
    falling=[];
    ov.style.display='flex';
    startBtn.textContent='Tekrar / Retry';
    finalEl.style.display='block';
    finalEl.textContent='Skor: '+score+' 🌯';
    const p=ov.querySelector('p');
    if(score>=25) p.textContent='Efsane! Dürüm ustası! 🏆';
    else if(score>=12) p.textContent='İyi iş! Denge uzmanı! 🌯';
    else if(score<5) p.textContent='Dürüm seni yendi! 😵';
    else p.textContent='Fena değil! Tekrar dene! 💪';
  }

  function loop(){
    if(!gameOn) return;
    if(stunTimer>0){
      stunTimer--;
      drawPlayer();
      if(stunTimer===0){ stunType=null; drawPlayer(); }
    } else {
      if(keys['ArrowLeft']||keys['a']) px=Math.max(0,px-5.5);
      if(keys['ArrowRight']||keys['d']) px=Math.min(W-PW,px+5.5);
      drawPlayer();
    }

    spawnT++;
    if(spawnT>=spawnRate){ spawnItem(); spawnT=0; }

    for(let i=falling.length-1;i>=0;i--){
      const el=falling[i];
      let y=parseFloat(el.dataset.y)+speed;
      let x=parseFloat(el.dataset.x)+parseFloat(el.dataset.vx);
      if(x<5) el.dataset.vx=Math.abs(parseFloat(el.dataset.vx));
      if(x>W-46) el.dataset.vx=-Math.abs(parseFloat(el.dataset.vx));
      el.dataset.y=y; el.dataset.x=x;
      el.style.top=y+'px'; el.style.left=x+'px';

      const hit=(y+40>PY)&&(y<PY+PH)&&(x+36>px+6)&&(x+8<px+PW-6);
      if(hit){
        const t=el.dataset.type;
        const em=el.dataset.emoji;
        try{gc.removeChild(el);}catch(e){}
        falling.splice(i,1);
        if(!stunTimer){ catchItem(t,em); }
        if(!gameOn) return;
      } else if(y>H+10){
        const t=el.dataset.type;
        try{gc.removeChild(el);}catch(e){}
        falling.splice(i,1);
        if(t==='durum'&&!stunTimer){
          hp=Math.max(0,hp-5);
          choke=Math.min(100,choke+4);
          updateBars();
        }
      }
    }
    aid=requestAnimationFrame(loop);
  }

  falling=[];keys={};
  drawPlayer();

  document.addEventListener('keydown',e=>{ keys[e.key]=true; });
  document.addEventListener('keyup',e=>{ keys[e.key]=false; });

  let drag=false,lastTX=0;
  gc.addEventListener('touchstart',e=>{drag=true;lastTX=e.touches[0].clientX;e.preventDefault();},{passive:false});
  gc.addEventListener('touchmove',e=>{
    if(!drag)return;
    const dx=e.touches[0].clientX-lastTX;
    lastTX=e.touches[0].clientX;
    if(!stunTimer) px=Math.max(0,Math.min(W-PW,px+dx*1.4));
    e.preventDefault();
  },{passive:false});
  gc.addEventListener('touchend',()=>drag=false);
  gc.addEventListener('mousemove',e=>{
    if(!gameOn||stunTimer)return;
    const rect=gc.getBoundingClientRect();
    px=Math.max(0,Math.min(W-PW,(e.clientX-rect.left)-PW/2));
  });

  startBtn.addEventListener('click',()=>{
    if(aid) cancelAnimationFrame(aid);
    initGame();
    loop();
  });
})();
</script>
