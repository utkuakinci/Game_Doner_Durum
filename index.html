
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');
  #gc{position:relative;width:100%;max-width:420px;margin:0 auto;height:600px;background:linear-gradient(180deg,#1a0533 0%,#2d0a4e 40%,#1a3a2a 80%,#0d2219 100%);border-radius:16px;overflow:hidden;font-family:'Nunito',sans-serif;cursor:none;border:2px solid #5a3080;box-shadow:0 0 40px #8b3fc844;}
  #stars{position:absolute;top:0;left:0;width:100%;height:60%;pointer-events:none;}
  #road{position:absolute;bottom:0;left:0;width:100%;height:80px;background:#1a1a2e;border-top:3px solid #ff6b35;}
  .roadmark{position:absolute;bottom:30px;height:8px;width:40px;background:#ffd700;border-radius:4px;}
  #player{position:absolute;bottom:90px;width:64px;height:80px;transition:left 0.05s linear;z-index:10;}
  .durum{position:absolute;width:44px;height:44px;z-index:8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;}
  #hud{position:absolute;top:12px;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box;z-index:20;}
  #scorebox{background:#ffffff18;border-radius:10px;padding:6px 14px;color:#fff;font-weight:800;font-size:18px;font-family:'Fredoka One',cursive;}
  #livebox{display:flex;gap:4px;font-size:22px;}
  #streak{position:absolute;top:56px;left:50%;transform:translateX(-50%);color:#ffd700;font-weight:800;font-size:15px;font-family:'Fredoka One',cursive;opacity:0;transition:opacity 0.3s;z-index:20;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#00000099;z-index:30;border-radius:16px;}
  #overlay h1{font-family:'Fredoka One',cursive;font-size:36px;color:#ffd700;margin:0 0 8px;text-shadow:0 2px 12px #ff6b35;}
  #overlay p{color:#fff;font-size:15px;margin:4px 0 20px;text-align:center;max-width:280px;font-weight:700;}
  #startbtn{background:linear-gradient(135deg,#ff6b35,#ff3b6b);color:#fff;border:none;border-radius:12px;padding:14px 36px;font-size:20px;font-family:'Fredoka One',cursive;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 20px #ff6b3566;transition:transform 0.1s;}
  #startbtn:hover{transform:scale(1.06);}
  #finalscore{font-family:'Fredoka One',cursive;font-size:28px;color:#ffd700;margin:8px 0;}
  #speedlabel{position:absolute;top:56px;right:16px;color:#ffffff88;font-size:12px;font-weight:700;z-index:20;}
  #combo{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:24px;color:#ff6b35;opacity:0;z-index:20;pointer-events:none;}
  .flash{animation:flashA 0.3s ease-out;}
  @keyframes flashA{0%{opacity:1;transform:translateX(-50%) scale(1.3);}100%{opacity:0;transform:translateX(-50%) scale(1.6);}}
  .miss-flash{animation:missA 0.4s ease-out;}
  @keyframes missA{0%{background:#ff000033;}50%{background:#ff000044;}100%{background:transparent;}}
</style>

<div id="gc">
  <canvas id="stars" width="420" height="360"></canvas>
  <div id="road">
    <div class="roadmark" style="left:30px"></div>
    <div class="roadmark" style="left:120px"></div>
    <div class="roadmark" style="left:210px"></div>
    <div class="roadmark" style="left:300px"></div>
    <div class="roadmark" style="left:390px"></div>
  </div>
  <div id="hud">
    <div id="scorebox">🌯 <span id="score">0</span></div>
    <div id="livebox"></div>
  </div>
  <div id="streak"></div>
  <div id="speedlabel"></div>
  <div id="combo"></div>
  <div id="player"></div>
  <div id="overlay">
    <div style="font-size:64px;margin-bottom:8px;">🌯</div>
    <h1>Dürüm Drop!</h1>
    <p>Catch falling doner wraps!<br>Use ← → arrow keys or tap/drag to move.</p>
    <button id="startbtn">OYNA / PLAY</button>
    <div id="finalscore" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  const gc=document.getElementById('gc');
  const overlay=document.getElementById('overlay');
  const scoreEl=document.getElementById('score');
  const livebox=document.getElementById('livebox');
  const streakEl=document.getElementById('streak');
  const speedEl=document.getElementById('speedlabel');
  const comboEl=document.getElementById('combo');
  const playerEl=document.getElementById('player');
  const finalScoreEl=document.getElementById('finalscore');
  const startBtn=document.getElementById('startbtn');

  const W=420,H=600,PLAYER_W=64,ROAD_H=80,PLAYER_Y=H-ROAD_H-80;
  const ITEMS=['🌯','🌯','🌯','🌯','🥙','🌯','🫔','🌯'];
  const BOMBS=['💣','🔥','❌'];

  let score,lives,falling,playerX,speed,spawnTimer,spawnRate,streak,gameRunning,animId,keys,touchStartX,bombChance;

  function drawStars(){
    const cv=document.getElementById('stars');
    const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    for(let i=0;i<80;i++){
      ctx.fillStyle=`rgba(255,255,255,${0.3+Math.random()*0.7})`;
      const x=Math.random()*420,y=Math.random()*360,r=Math.random()*1.5+0.3;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    }
  }

  function drawPlayer(x){
    playerEl.style.left=(x)+'px';
    playerEl.innerHTML=`
      <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="14" r="12" fill="#FFDAA5" stroke="#c98a4a" stroke-width="1.5"/>
        <rect x="14" y="24" width="36" height="28" rx="8" fill="#e74c3c"/>
        <rect x="16" y="28" width="6" height="20" rx="3" fill="#c0392b"/>
        <rect x="42" y="28" width="6" height="20" rx="3" fill="#c0392b"/>
        <rect x="18" y="52" width="10" height="22" rx="5" fill="#3a6ecc"/>
        <rect x="36" y="52" width="10" height="22" rx="5" fill="#3a6ecc"/>
        <text x="32" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#5a3010">YUM</text>
      </svg>`;
  }

  function setLives(l){
    lives=l;
    livebox.innerHTML='';
    for(let i=0;i<3;i++) livebox.innerHTML+=`<span style="font-size:22px;opacity:${i<l?1:0.25}">❤️</span>`;
  }

  function spawnItem(){
    const isBomb=Math.random()<bombChance;
    const emoji=isBomb?BOMBS[Math.floor(Math.random()*BOMBS.length)]:ITEMS[Math.floor(Math.random()*ITEMS.length)];
    const el=document.createElement('div');
    el.className='durum';
    el.textContent=emoji;
    el.dataset.bomb=isBomb?'1':'0';
    const x=Math.random()*(W-60)+10;
    el.style.left=x+'px';
    el.style.top='-50px';
    el.dataset.x=x;
    el.dataset.y=-50;
    el.dataset.vx=(Math.random()-0.5)*1.2;
    gc.appendChild(el);
    falling.push(el);
  }

  function showCombo(n){
    if(n<2)return;
    comboEl.textContent=n>=5?`🔥 ${n}x COMBO!`:`✨ ${n}x Combo!`;
    comboEl.style.opacity=1;
    comboEl.classList.remove('flash');
    void comboEl.offsetWidth;
    comboEl.classList.add('flash');
    setTimeout(()=>{comboEl.style.opacity=0;},500);
  }

  function initGame(){
    score=0;lives=3;streak=0;speed=2.5;spawnRate=90;spawnTimer=0;bombChance=0.08;gameRunning=true;
    scoreEl.textContent=0;
    setLives(3);
    falling.forEach(f=>{try{gc.removeChild(f);}catch(e){}});
    falling=[];
    playerX=(W-PLAYER_W)/2;
    drawPlayer(playerX);
    streakEl.style.opacity=0;
    overlay.style.display='none';
    speedEl.textContent='';
  }

  function endGame(){
    gameRunning=false;
    cancelAnimationFrame(animId);
    falling.forEach(f=>{try{gc.removeChild(f);}catch(e){}});
    falling=[];
    overlay.style.display='flex';
    startBtn.textContent='Tekrar / Retry';
    finalScoreEl.style.display='block';
    finalScoreEl.textContent=`Score: ${score} 🌯`;
    const msg=document.querySelector('#overlay p');
    if(score>=20)msg.textContent='Ustasın! You\'re the Dürüm Master! 🏆';
    else if(score>=10)msg.textContent='Güzel! Pretty good catch! 🌯';
    else msg.textContent='Tough luck! Try again? 💪';
  }

  function gameLoop(){
    if(!gameRunning)return;
    const speed_px=speed;

    if(keys['ArrowLeft']||keys['a']) playerX=Math.max(0,playerX-5.5);
    if(keys['ArrowRight']||keys['d']) playerX=Math.min(W-PLAYER_W,playerX+5.5);
    drawPlayer(playerX);

    spawnTimer++;
    if(spawnTimer>=spawnRate){
      spawnItem();
      spawnTimer=0;
    }

    for(let i=falling.length-1;i>=0;i--){
      const el=falling[i];
      let y=parseFloat(el.dataset.y)+speed_px;
      let x=parseFloat(el.dataset.x)+parseFloat(el.dataset.vx);
      if(x<5)el.dataset.vx=Math.abs(parseFloat(el.dataset.vx));
      if(x>W-50)el.dataset.vx=-Math.abs(parseFloat(el.dataset.vx));
      el.dataset.y=y;el.dataset.x=x;
      el.style.top=y+'px';el.style.left=x+'px';

      const py=PLAYER_Y,px2=playerX;
      const caught=(y+40>py)&&(y<py+80)&&(x+38>px2+8)&&(x+8<px2+PLAYER_W-8);

      if(caught){
        const isBomb=el.dataset.bomb==='1';
        try{gc.removeChild(el);}catch(e){}
        falling.splice(i,1);
        if(isBomb){
          streak=0;streakEl.style.opacity=0;
          lives=Math.max(0,lives-1);setLives(lives);
          gc.classList.add('miss-flash');setTimeout(()=>gc.classList.remove('miss-flash'),400);
          if(lives<=0){endGame();return;}
        } else {
          streak++;
          const pts=streak>=5?3:streak>=3?2:1;
          score+=pts;
          scoreEl.textContent=score;
          showCombo(streak);
          if(streak>=3){streakEl.textContent=`🔥 ${streak} streak!`;streakEl.style.opacity=1;}
          if(score%10===0&&score>0){speed+=0.3;spawnRate=Math.max(35,spawnRate-5);bombChance=Math.min(0.22,bombChance+0.012);speedEl.textContent=`Level ${Math.floor(score/10)+1}`;}
        }
      } else if(y>H+10){
        const isBomb=el.dataset.bomb==='1';
        try{gc.removeChild(el);}catch(e){}
        falling.splice(i,1);
        if(!isBomb){
          streak=0;streakEl.style.opacity=0;
          lives=Math.max(0,lives-1);setLives(lives);
          gc.classList.add('miss-flash');setTimeout(()=>gc.classList.remove('miss-flash'),400);
          if(lives<=0){endGame();return;}
        }
      }
    }
    animId=requestAnimationFrame(gameLoop);
  }

  falling=[];keys={};
  drawStars();
  drawPlayer((W-PLAYER_W)/2);

  document.addEventListener('keydown',e=>{keys[e.key]=true;});
  document.addEventListener('keyup',e=>{keys[e.key]=false;});

  let dragging=false,lastTX=0;
  gc.addEventListener('touchstart',e=>{
    dragging=true;lastTX=e.touches[0].clientX;e.preventDefault();
  },{passive:false});
  gc.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-lastTX;
    lastTX=e.touches[0].clientX;
    playerX=Math.max(0,Math.min(W-PLAYER_W,playerX+dx*1.5));
    e.preventDefault();
  },{passive:false});
  gc.addEventListener('touchend',()=>{dragging=false;});

  gc.addEventListener('mousemove',e=>{
    if(!gameRunning)return;
    const rect=gc.getBoundingClientRect();
    playerX=Math.max(0,Math.min(W-PLAYER_W,(e.clientX-rect.left)-PLAYER_W/2));
  });

  startBtn.addEventListener('click',()=>{
    if(animId)cancelAnimationFrame(animId);
    initGame();
    gameLoop();
  });
})();
</script>
